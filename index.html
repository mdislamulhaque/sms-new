<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/main.min.css" rel="stylesheet">
</head>
<body>

<div class="login-wrapper d-flex align-items-center justify-content-center">
    <div class="login-card">
        <!-- Logo -->
        <div class="text-center mb-4">
            <img src="https://dummyimage.com/80x80/1e73be/ffffff&text=O" alt="Logo" class="mb-2">
            <h5 class="fw-semibold">Login</h5>
        </div>

        <!-- Login Form -->
        <form>
            <div class="mb-3">
                <label class="form-label text-muted">User ID or Email</label>
                <input type="text" class="form-control" value="01711441623">
            </div>

            <div class="mb-3">
                <label class="form-label text-muted">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password">
                    <button class="btn password-toggle" type="button" onclick="togglePassword()">
                        👁
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">
                        Remember Me
                    </label>
                </div>
                <a href="#" class="forgot-link">Forgot Your Password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                <a href="dashboard.html">Log in</a>
            </button>

            <button type="button" class="btn btn-outline-primary w-100">
                👥 Authenticate using Passkey
            </button>
        </form>
    </div>
</div>

<!-- Footer -->
<div class="text-center footer-text">
    © 2019–2025 · Crafted with ❤️ by EximusEdu
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="assets/js/app.js"></script>


</body>
</html>
